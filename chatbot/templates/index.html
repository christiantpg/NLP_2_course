<!DOCTYPE html>
<html>
<head>
    <title>Chat CV RAG</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div id="chat-wrapper">
    <header>Chat con mi CV</header>
    <div id="chat-container"></div>
    <div id="input-container">
        <input type="text" id="message" placeholder="Escribí tu mensaje...">
        <button onclick="sendMessage()">Enviar</button>
    </div>
</div>

<script>
    const input = document.getElementById("message");

    // Enviar mensaje al presionar Enter
    input.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            event.preventDefault(); // evita salto de línea
            sendMessage();
        }
    });

    async function sendMessage() {
        const msg = input.value;
        if (!msg) return;

        const chatContainer = document.getElementById("chat-container");
        chatContainer.innerHTML += `<div class="message user">${msg}</div>`;
        input.value = "";
        chatContainer.scrollTop = chatContainer.scrollHeight;

        // 👉 Agregamos loading
        const loadingId = "loading-" + Date.now();
        chatContainer.innerHTML += `
            <div class="message bot loading" id="${loadingId}">
                <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            </div>`;
        chatContainer.scrollTop = chatContainer.scrollHeight;

        try {
            const res = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: msg })
            });

            const data = await res.json();

            // 👉 Reemplazamos el loading por la respuesta real
            const loadingEl = document.getElementById(loadingId);
            if (loadingEl) {
                loadingEl.outerHTML = `<div class="message bot">${data.answer}</div>`;
            }
        } catch (err) {
            const loadingEl = document.getElementById(loadingId);
            if (loadingEl) {
                loadingEl.outerHTML = `<div class="message bot error">Error al obtener respuesta</div>`;
            }
        }

        chatContainer.scrollTop = chatContainer.scrollHeight;
    }
</script>
</body>
</html>
